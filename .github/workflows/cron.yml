name: Update Weather Cache

on:
  schedule:
    # 毎時17分に実行（日本時間 JST 毎時17分 / UTC 毎時17分）
    # ※混雑するジャストタイム（0分・30分等）を回避
    - cron: '17 * * * *'
  workflow_dispatch: # GitHub画面から手動でテスト実行できるようにするスイッチ

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cron Endpoint
        run: |
          curl -s -X GET "https://fishing-weather-bot.onrender.com/cron_trigger"
